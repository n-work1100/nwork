<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="assets/css/style.css">
	<title>Repeat Linux</title>
</head>
<body>

	<div class="wrapp">
		<div class="container">
			<header class="header">
				repeat linux
			</header>

			<nav class="menu">
				<ul class="menu__list">
					<li class="menu__item"><a href="index.html" class="menu__link">Home</a></li>
					<li class="menu__item"><a href="cli.html" class="menu__link">CLI</a></li>
					<li class="menu__item"><a href="py.html" class="menu__link">Python</a></li>
					<li class="menu__item"><a href="linux.html" class="menu__link">Linux</a></li>
					<li class="menu__item"><a href="english.html" class="menu__link">English</a></li>
					<li class="menu__item"><a href="" class="menu__link">menu4</a></li>
				</ul>
			</nav>

			<main class="content">

				<div class="content__item q-1" data-num="1">
					<div class="content-question item">
						<span class="q-num">Question 1 of 1</span>
						<div class="question-text">Зайти в привілейований режим</div>
						<div class="buttons">
							<button class="btn-previous"><<<</button>
							<button class="btn-next">>>></button>
						</div>
					</div>
					<div class="content-answer item">
						<span class="a-num">Answer 1 of 1</span>
						<div class="answer-text" style="visibility: hidden;">R1&gt; enable</div>
						<button class="btn-show-hide">Show / Hide</button>
					</div>
				</div>

				<div class="main-buttons">
					<button class="btn-new-question">
						New Question
					</button>

					<button class="btn-edit">
						Edit
					</button>

					<button class="btn-delete">
						Delete
					</button>
				</div>

				<div class="edit-delete">
					<span class="title-edit">Select number to edit</span>
					<span class="title-delete">Select number to delete</span>
					<select name="count" class="number-to-edit-delete">
						<option value="1"></option>
					</select>
					
					<div class="btn-cancel-delete">
						<button class="btn-cancel">Cancel</button>
						<button class="btn-confirm">Confirm</button>
					</div>
				</div>

				<form action="#" class="form-input">
					<div class="form-input__text">
						<span class="new-q-num">New question #</span>
						<textarea name="new-q" id="new-q-id" class="input-q" spellcheck="true"></textarea>
					</div>

					<div class="form-input__text">
						<span class="new-a-num">Answer to #</span>
						<textarea name="new-a" id="new-a-id" class="input-a" spellcheck="true"></textarea>
					</div>
				</form>

				<div class="btns-create-exit">
					<button class="btn-new-create">
						Create
					</button>
					
					<button class="btn-new-exit">
						Exit
					</button>
				</div>
			</main>

			<footer class="footer">
				FOOTER
			</footer>
		</div>
	</div>

	<script src="assets/js/script.js"></script>
	
</body>
</html>
